[project]
name = "contextforge"
version = "0.1.0"
description = "ContextForge API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic-settings>=2.6",
    "psycopg2-binary>=2.9",
    "greenlet>=3.1",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "pydantic[email]>=2.9",
    "redis>=5.0",
    # botocore/boto3 pinned below aiobotocore 2.25.1's <1.40.62 ceiling -
    # newer versions (pulled in transitively by langchain-aws, if added later)
    # conflict with aioboto3's S3/SQS clients. Bump all three together.
    "botocore>=1.40.46,<1.40.62",
    "boto3>=1.40.46,<1.40.62",
    "aioboto3>=13.2,<16",
    "python-multipart>=0.0.12",
    "langchain-core>=1.6",
    "langchain-text-splitters>=1.1",
    "langchain-community>=0.4",
    "langchain-qdrant>=1.1",
    "qdrant-client>=1.19",
    "numpy>=1.26",
    "pypdf>=5.0",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.8",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "fakeredis>=2.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = [
    "B008",  # Depends(...) in argument defaults is the required FastAPI DI pattern, not a bug
    "UP046", # Generic[T] kept over PEP 695 `class Foo[T]` for broader pydantic-generics compatibility
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
