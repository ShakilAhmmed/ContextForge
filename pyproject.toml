[project]
name = "contextforge"
version = "0.1.0"
description = "ContextForge API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic-settings>=2.6",
    "psycopg2-binary>=2.9",
    "greenlet>=3.1",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "pydantic[email]>=2.9",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "fakeredis>=2.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = [
    "B008",  # Depends(...) in argument defaults is the required FastAPI DI pattern, not a bug
    "UP046", # Generic[T] kept over PEP 695 `class Foo[T]` for broader pydantic-generics compatibility
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
