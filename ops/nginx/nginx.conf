worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Docker's embedded DNS. A variable in proxy_pass (below) forces nginx to
    # re-resolve "api" through this on each request instead of caching the
    # IP once at startup - otherwise recreating the api container (a new
    # build, a restart) leaves nginx proxying to a dead IP until it's
    # restarted too.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name contextforge.local;
        # Port must match HTTPS_PORT in ops/docker/.env (default 8443) -
        # nginx can't see the host's published port from inside the container.
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 443 ssl;
        server_name contextforge.local;

        ssl_certificate     /etc/nginx/certs/dev.crt;
        ssl_certificate_key /etc/nginx/certs/dev.key;

        client_max_body_size 20m;

        set $api_upstream api:8000;

        location /health {
            proxy_pass http://$api_upstream/health;
        }

        location / {
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
