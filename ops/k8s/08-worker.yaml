apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: contextforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: contextforge-api:latest
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
