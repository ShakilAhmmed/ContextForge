# Dev/demo only. In real environments, create this Secret out-of-band
# (sealed-secrets, external-secrets, etc.) and do not commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: contextforge
type: Opaque
stringData:
  POSTGRES_USER: contextforge
  POSTGRES_PASSWORD: contextforge
  POSTGRES_DB: contextforge
