# Dev/demo only. Generate a real secret (32+ random bytes) per environment and
# manage it out-of-band (sealed-secrets, external-secrets, etc.) in real clusters.
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: contextforge
type: Opaque
stringData:
  JWT_SECRET: dev-secret-change-me-32-bytes-minimum
  # Must match 02c-minio.yaml's minio-secret values - same dev-only rationale.
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  # ElasticMQ doesn't validate these, but the SQS client requires something.
  SQS_ACCESS_KEY: "x"
  SQS_SECRET_KEY: "x"
