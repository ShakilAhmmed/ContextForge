# Dev/demo only. Generate a real secret (32+ random bytes) per environment and
# manage it out-of-band (sealed-secrets, external-secrets, etc.) in real clusters.
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: contextforge
type: Opaque
stringData:
  JWT_SECRET: dev-secret-change-me-32-bytes-minimum
