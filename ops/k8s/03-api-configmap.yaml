# DATABASE_URL below embeds the demo password from 01-postgres-secret.yaml.
# Real environments: put DATABASE_URL in a Secret instead, sourced from a
# secrets manager, not a ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: contextforge
data:
  ENV: "production"
  DATABASE_URL: "postgresql+asyncpg://contextforge:contextforge@postgres:5432/contextforge"
  REDIS_URL: "redis://redis:6379/0"
  S3_ENDPOINT_URL: "http://minio:9000"
  S3_BUCKET: "contextforge-documents"
  S3_REGION: "us-east-1"
  SQS_ENDPOINT_URL: "http://elasticmq:9324"
  SQS_REGION: "us-east-1"
  SQS_INGESTION_QUEUE_URL: "http://elasticmq:9324/000000000000/document-ingestion"
