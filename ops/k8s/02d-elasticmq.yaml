apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticmq-config
  namespace: contextforge
data:
  elasticmq.conf: |
    include classpath("application.conf")

    queues {
      document-ingestion {
        defaultVisibilityTimeout = 30 seconds
        delay = 0 seconds
        receiveMessageWait = 0 seconds
        deadLettersQueue {
          name = "document-ingestion-dlq"
          maxReceiveCount = 3
        }
      }
      document-ingestion-dlq { }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticmq
  namespace: contextforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticmq
  template:
    metadata:
      labels:
        app: elasticmq
    spec:
      containers:
        - name: elasticmq
          image: softwaremill/elasticmq-native:1.6.7
          ports:
            - containerPort: 9324
          volumeMounts:
            - name: config
              mountPath: /opt/elasticmq.conf
              subPath: elasticmq.conf
          readinessProbe:
            exec:
              command: ["nc", "-z", "localhost", "9324"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: elasticmq-config
---
apiVersion: v1
kind: Service
metadata:
  name: elasticmq
  namespace: contextforge
spec:
  selector:
    app: elasticmq
  ports:
    - port: 9324
      targetPort: 9324
