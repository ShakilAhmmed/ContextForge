apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: contextforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data"]
          envFrom:
            - secretRef:
                name: minio-secret
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: miniodata
              mountPath: /data
          readinessProbe:
            exec:
              command: ["mc", "ready", "local"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: miniodata
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: contextforge
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: contextforge
spec:
  selector:
    app: minio
  ports:
    - port: 9000
      targetPort: 9000
---
# Dev/demo only - same rationale as 01-postgres-secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: contextforge
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin
